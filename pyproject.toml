[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robust-metric-lab"
version = "0.1.0"
description = "CIFAR-10 robustness metric experiments using RobustBench models."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch",
    "torchvision",
    "robustbench",
    "pyyaml",
    "pandas",
    "scipy",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
# Only scripts/plot_e37_layer_diagnostic.py needs this; the metric pipeline does not.
plot = ["matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

